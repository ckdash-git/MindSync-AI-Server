version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mindsync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_db_password}
      POSTGRES_DB: ${DB_NAME:-mindsync}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindsync} -d ${DB_NAME:-mindsync}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
